[project]
name = "camdesign"
version = "0.1.0"
description = "A field-friendly camera blueprint workspace for quote preparation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3,<4",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.2,<1",
]

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camdesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
