<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}CamDesign{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block body %}
      <header class="site-header">
        <a class="brand" href="{{ url_for('projects.index') }}" aria-label="CamDesign projects">
          <img
            class="brand__logo"
            src="{{ url_for('static', filename='images/camdesign-logo.png') }}"
            width="640"
            height="353"
            alt=""
          >
          <span>CamDesign</span>
        </a>
        <a class="button button--primary" href="{{ url_for('projects.new') }}">New project</a>
      </header>
      <main class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="notice notice--{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    {% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
